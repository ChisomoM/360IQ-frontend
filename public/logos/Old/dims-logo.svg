<?xml version="1.0" encoding="UTF-8"?>
<!--
  DIMS Logo — 3c Deep Purple Fold
  Lockup: Page-D mark (negative-space D with purple fold) + Slash wordmark
  Colors: Ink #111827 / #0F172A · Accent #A855F7
  Font: Geist 700 (Google Fonts)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 460 128"
  width="460"
  height="128"
  role="img"
  aria-labelledby="dims-logo-title"
>
  <title id="dims-logo-title">DIMS — Document Intelligence &amp; Management System</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@700&amp;display=swap');
    </style>

    <!-- Subtle inner-shadow on the fold edge -->
    <filter id="fold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#A855F7" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════
       MARK — Page-D with deep purple fold (3c)
       Nested SVG preserves original 64×64 geometry at 108×108.
       ═══════════════════════════════════════════════════════════ -->
  <svg x="0" y="10" width="108" height="108" viewBox="0 0 64 64" overflow="visible">
    <!-- Dark rounded container -->
    <rect x="6" y="6" width="52" height="52" rx="10" fill="#111827"/>

    <!-- White negative-space D (the page body) -->
    <path d="M20 18 L20 46 L30 46 Q44 46 44 32 Q44 18 30 18 Z" fill="#ffffff"/>

    <!-- Purple fold triangle -->
    <path d="M44 18 L30 18 L44 32 Z" fill="#A855F7" filter="url(#fold-glow)"/>

    <!-- Fold crease highlight (white hairline) -->
    <path d="M44 18 L44 32 L30 18" stroke="#ffffff" stroke-width="0.75" fill="none" stroke-linecap="round" opacity="0.55"/>
  </svg>

  <!-- ═══════════════════════════════════════════════════════════
       WORDMARK — D [purple slash-page] MS
       Font: Geist 700, 84px, letter-spacing −0.04em (≈−3.4px)
       Baseline y=98 · Cap top y=36 (cap-height ≈62px at 84px)

       Slash geometry (skewX−20° parallelogram):
         font-size 84px → slash width=21, height=62, lean=23
         Corners: tl(214,36) tr(235,36) br(212,98) bl(191,98)
         Path: M214,36 L235,36 L212,98 L191,98 Z
       ═══════════════════════════════════════════════════════════ -->

  <!-- Draw order matches original design: D → slash (on top of D) → MS -->

  <!-- "D" -->
  <text
    x="128"
    y="98"
    font-family="Geist, Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"
    font-weight="700"
    font-size="84"
    fill="#0F172A"
    letter-spacing="-3"
  >D</text>

  <!-- Purple slash — represents the letter I, leaning like an italic page.
       Parallelogram: skewX(−20°) equivalent.
       Width 21 · Height 62 · Lean 23 (= 62 × tan 20°)
       tl(214,36) tr(235,36) br(212,98) bl(191,98) -->
  <path d="M214,36 L235,36 L212,98 L191,98 Z" fill="#A855F7"/>

  <!-- "MS" -->
  <text
    x="242"
    y="98"
    font-family="Geist, Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"
    font-weight="700"
    font-size="84"
    fill="#0F172A"
    letter-spacing="-3"
  >MS</text>

</svg>
